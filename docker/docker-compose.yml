services:
  postgres:
    image: postgres:15-alpine
    container_name: otp-postgres
    environment:
      POSTGRES_DB: otp_service
      POSTGRES_USER: otp_user
      POSTGRES_PASSWORD: otp_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - otp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otp_user -d otp_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  otp-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: otp-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/otp_service
      DB_USERNAME: otp_user
      DB_PASSWORD: otp_secure_password
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMPP_HOST: smpp-smsc-simulator-smscsimulator-1
      SMPP_PORT: 2775
    ports:
      - "8080:8080"
    volumes:
      - ../logs:/app/logs
      - ../otp-files:/app/otp-files
      # Монтируем конфиги в нужные места
      - ./config/application.properties:/app/application.properties:ro
      - ./config/email.properties:/app/email.properties:ro
      - ./config/sms.properties:/app/sms.properties:ro
      - ./config/telegram.properties:/app/telegram.properties:ro
      # Дублируем в /app/config/
      - ./config/application.properties:/app/config/application.properties:ro
      - ./config/email.properties:/app/config/email.properties:ro
      - ./config/sms.properties:/app/config/sms.properties:ro
      - ./config/telegram.properties:/app/config/telegram.properties:ro
    networks:
      - otp-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  otp-network:
    external: true
    name: otp-network
