# Application
app.name=OTP Service
app.version=1.0.0
app.port=8080

# Database - для Docker используем имя сервиса "postgres"
db.url=jdbc:postgresql://postgres:5432/otp_service
db.username=otp_user
db.password=otp_secure_password
db.pool.size=10

# JWT
jwt.secret=super-secret-jwt-key-for-otp-service-2024-32bytes
jwt.expiration.ms=86400000

# Logging
logging.level.com.promo.otp=DEBUG
logging.file.path=./logs
